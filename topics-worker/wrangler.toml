name = "paperlab-topics-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# HyperDataLab's Cloudflare account (phuong@hyperdatalab.org). Never deploy lab workers to another account.
account_id = "124949a79dc6c5894bc492942593cb51"

[vars]
SSO_BASE_URL = "https://rpr-grobid-gateway.hpl-storage.workers.dev"
ALLOWED_DOMAIN = "hyperdatalab.org"
ALLOWED_ORIGINS = "https://hyperdatalab-paragraph-lab.web.app,https://hyperdatalab-paragraph-lab.firebaseapp.com,http://localhost:5173,http://localhost:5174"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "paper-fetch"

[[containers]]
class_name = "TopicsContainer"
image = "./topics/Dockerfile"
# The Dockerfile copies topics/..., so the build context is this directory, not topics/.
image_build_context = "."
instance_type = "standard-3"
max_instances = 1

[[durable_objects.bindings]]
name = "TOPICS"
class_name = "TopicsContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TopicsContainer"]

# spaCy parse service for POST /nlp/parse (P6). Its own small image: spaCy + en_core_web_sm, no torch.
[[containers]]
class_name = "NlpContainer"
image = "./nlp/Dockerfile"
image_build_context = "."
instance_type = "basic"
max_instances = 1

[[durable_objects.bindings]]
name = "NLP"
class_name = "NlpContainer"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["NlpContainer"]
