name = "paperlab-pdf-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# HyperDataLab's Cloudflare account (phuong@hyperdatalab.org). Never deploy lab workers to another account.
account_id = "124949a79dc6c5894bc492942593cb51"

# The shared plan schema is outside worker/; resolve its Zod import to this package.
[alias]
zod = "./node_modules/zod/index.js"

[vars]
SSO_BASE_URL = "https://rpr-grobid-gateway.hpl-storage.workers.dev"
# Fill with the deployed ResearchHub Files API base URL (NEXT_PUBLIC_FILE_API_URL in ResearchHub).
RESEARCH_HUB_API_URL = "https://research-hub-files.hyperdatalab.workers.dev"
ALLOWED_DOMAIN = "hyperdatalab.org"
ADMIN_EMAILS = "phuong@hyperdatalab.org,duylh@hyperdatalab.org"
ALLOWED_ORIGINS = "https://hyperdatalab-paragraph-lab.web.app,https://hyperdatalab-paragraph-lab.firebaseapp.com,https://paperlab.hyperdatalab.org,https://hyperdatalab-writing-bank.web.app,https://hyperdatalab-writing-bank.firebaseapp.com,https://hyperdatalab-idea2hypo.web.app,https://hyperdatalab-idea2hypo.firebaseapp.com,http://localhost:5173,http://localhost:5174"
NLP_URL = "https://paperlab-topics-worker.hyperdatalab.workers.dev"
LLM_ALLOWED_HOSTS = "9router.dcloud.io.vn,9router.oraltest.site"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "KG"
database_name = "paperlab-kg"
database_id = "ca50e0f2-1ea6-4a3a-bec1-12d3b6fd2820"

[[d1_databases]]
binding = "DATA"
database_name = "paperlab-data"
database_id = "bc85e212-9260-49af-9356-112777035255"
migrations_dir = "migrations-data"

[[vectorize]]
binding = "KG_VECTORS"
index_name = "paperlab-kg-papers"

[ai]
binding = "AI"

# The lab's shared bucket; PaperLab writes under paperlab/.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "paper-fetch"

# Call the ResearchHub Files API over Cloudflare's internal Worker-to-Worker binding.
[[services]]
binding = "RESEARCH_HUB"
service = "research-hub-files"
remote = true

# The CRF image fits the available memory without the larger deep-learning models.
# Bumping the GROBID image version also requires changing GROBID_CACHE_TAG.
[[containers]]
class_name = "GrobidContainer"
image = "docker.io/grobid/grobid:0.9.0-crf"
instance_type = "standard-2"
max_instances = 2

[[durable_objects.bindings]]
name = "GROBID"
class_name = "GrobidContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GrobidContainer"]
