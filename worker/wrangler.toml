name = "paperlab-pdf-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# HyperDataLab's Cloudflare account (phuong@hyperdatalab.org). Never deploy lab workers to another account.
account_id = "124949a79dc6c5894bc492942593cb51"

# The shared plan schema is outside worker/; resolve its Zod import to this package.
[alias]
zod = "./node_modules/zod/index.js"

[vars]
FIREBASE_PROJECT_ID = "hyperdatalab-paragraph-lab"
ALLOWED_DOMAIN = "hyperdatalab.org"
ADMIN_EMAILS = "phuong@hyperdatalab.org"
# Owner, 2026-11-18: the Writing Bank site (its own Firebase project) may call this worker, e.g. POST /v1/measure.
# Lab sign-in (ALLOWED_DOMAIN) still applies to tokens from both projects.
ACCEPTED_PROJECT_IDS = "hyperdatalab-paragraph-lab,hyperdatalab-writing-bank"
ALLOWED_ORIGINS = "https://hyperdatalab-paragraph-lab.web.app,https://hyperdatalab-paragraph-lab.firebaseapp.com,https://hyperdatalab-writing-bank.web.app,https://hyperdatalab-writing-bank.firebaseapp.com,http://localhost:5174"
# Grammar parser (P6) for POST /v1/measure: the topics worker's /nlp/parse, called with the caller's token.
NLP_URL = "https://paperlab-topics-worker.hyperdatalab.workers.dev"
# Optional OpenAlex contact. Set OPENALEX_MAILTO to a lab contact when one is configured.

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "KG"
database_name = "paperlab-kg"
# Created 2026-11-19 on the HyperDataLab account (APAC).
database_id = "ca50e0f2-1ea6-4a3a-bec1-12d3b6fd2820"

# The central lab store (ADR-0007): one row per record; bodies in BUCKET under paperlab/data/.
# Created at the owner's deploy: `wrangler d1 create paperlab-data`, put its id here, then
# `wrangler d1 migrations apply paperlab-data --remote`. Without it the /v1/data routes answer 503.
[[d1_databases]]
binding = "DATA"
database_name = "paperlab-data"
database_id = "TO_BE_CREATED_ON_DEPLOY"
migrations_dir = "migrations-data"

[[vectorize]]
binding = "KG_VECTORS"
index_name = "paperlab-kg-papers"

[ai]
binding = "AI"

# The lab's shared bucket; PaperLab writes under paperlab/.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "paper-fetch"

# The CRF image fits the available memory without the larger deep-learning models.
# Bumping the GROBID image version also requires changing GROBID_CACHE_TAG.
[[containers]]
class_name = "GrobidContainer"
image = "docker.io/grobid/grobid:0.9.0-crf"
instance_type = "standard-2"
max_instances = 2

[[durable_objects.bindings]]
name = "GROBID"
class_name = "GrobidContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GrobidContainer"]
